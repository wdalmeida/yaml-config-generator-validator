# Timed acceptances for OSV-Scanner, expiring 2026-09-23.
#
# Passed explicitly with --config from container.yml. A future `ignoreUntil` removes the
# finding from OSV-Scanner's JSON entirely, which is what lets the CVSS gate in that workflow
# keep working unchanged; once the date passes, the finding comes back and the build fails
# again. That is the intent - this is a deadline, not a dismissal.
#
# OSV reports the Alpine openssl advisories individually under ALPINE-CVE-* ids, so the same
# base-image problem Trivy reports as one CVE appears here as nine. All nine are the same
# package at the same version (openssl 3.5.7-r0, fixed in 3.5.8-r0) and all nine disappear
# together when the base image is bumped. Two are CVSS >= 9.0 - see the PR discussion.

[[IgnoredVulns]]
id = "ALPINE-CVE-2026-14456"
ignoreUntil = 2026-09-23
reason = "openssl 3.5.7-r0 in the pinned base image (CVSS 7.5). Fixed in 3.5.8-r0; awaiting an upstream nginx-unprivileged rebuild."

