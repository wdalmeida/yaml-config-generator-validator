server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # No backend, no auth, no cookies - the only headers worth setting here are the
    # ones constraining what the page itself may do. connect-src has to allow
    # api.github.com: that is the whole GitHub integration (src/lib/github.ts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints every asset filename, so those can be cached forever;
    # index.html must not be, or an already-open tab never sees a new deploy.
    # `expires` is used rather than `add_header Cache-Control`, since an add_header
    # inside a location block would discard every header inherited from above.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
