# Only used by Containerfile.redhat, copied in as /etc/nginx/conf.d/00-temp-paths.conf.
#
# nginx creates every temp directory it might need at startup, before dropping to the
# worker user - and hi/nginx keeps them under /var/lib/nginx/tmp, owned by uid 999
# (the `nginx` rpm user) with mode 0770. The container runs as 65532, so that directory
# is unwritable even on a writable root filesystem, and the process dies with
#   [emerg] mkdir() "/var/lib/nginx/tmp/client_body" failed
# before it ever binds a port. Pointing all five at /tmp - the one path the documented
# `--read-only --tmpfs /tmp` run actually leaves writable - is what makes a read-only
# root filesystem work here, and it is exactly what nginx-unprivileged (the Alpine
# image's base) already does in its own nginx.conf, which is why container/nginx.conf
# needs none of this.
#
# conf.d/*.conf is included from inside `http { }`, so these are in a legal context.
# The 00- prefix only documents that they are infrastructure, not a server block -
# nginx is order-independent here.
#
# Nothing in this app ever writes any of them: it is a static site serving GETs, so
# there are no request bodies over the buffer size and nothing is proxied. They exist
# so nginx can start.
client_body_temp_path /tmp/client_body;
proxy_temp_path       /tmp/proxy;
fastcgi_temp_path     /tmp/fastcgi;
uwsgi_temp_path       /tmp/uwsgi;
scgi_temp_path        /tmp/scgi;
