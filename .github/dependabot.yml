version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait 7 days before proposing an update to a newly-published version - gives the
    # community time to catch a compromised-maintainer-account release before it gets
    # auto-proposed here (this is a real, recurring npm attack pattern).
    cooldown:
      default-days: 7

  # GitHub Actions themselves (uses: owner/repo@<sha> # vX.Y.Z pins) are managed by Renovate
  # instead (see renovate.json) - it also covers Docker image digests and tool versions
  # embedded in workflow run: scripts that this ecosystem can't see, so keeping actions here
  # too would just mean two bots opening competing PRs for the same pin.
