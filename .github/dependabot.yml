version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Wait 7 days before proposing an update to a newly-published version - gives the
    # community time to catch a compromised-maintainer-account release before it gets
    # auto-proposed here (this is a real, recurring npm attack pattern).
    cooldown:
      default-days: 7

  # Dependabot understands the `uses: owner/repo@<sha> # vX.Y.Z` pinning convention used
  # throughout .github/workflows/ - it opens a PR updating both the SHA and the comment
  # together, so pinning to a commit (rather than a floating tag) doesn't mean manual upkeep.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
