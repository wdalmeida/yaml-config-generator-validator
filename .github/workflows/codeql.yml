name: CodeQL

# This analyses JavaScript/TypeScript, so anything that cannot become JS/TS is filtered out.
# Skipping analysis on a push does not clear existing alerts, and the weekly cron re-analyses
# main regardless, so a gap here closes itself.
# Nothing in this workflow is a required status check. If that ever changes, these filters
# must go with it: a workflow skipped by a path filter never creates its check runs, so a
# required check would sit Pending forever and the PR could never merge. ci.yml gates its jobs
# from the inside (a `changes` job plus `if:`) for exactly that reason.
#
# The two lists below are identical and must stay that way - GitHub Actions has no YAML
# anchors, and actionlint will not notice them drifting. Change one, change the other.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'charts/**'
      - 'container/**'
      - 'Containerfile*'
      - '.containerignore'
      - '.devcontainer/**'
      - '.trivyignore.yaml'
      - 'osv-scanner.toml'
      - '.kube-linter.yaml'
      - 'justfile'
      - 'Brewfile'
      - 'renovate.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'charts/**'
      - 'container/**'
      - 'Containerfile*'
      - '.containerignore'
      - '.devcontainer/**'
      - '.trivyignore.yaml'
      - 'osv-scanner.toml'
      - '.kube-linter.yaml'
      - 'justfile'
      - 'Brewfile'
      - 'renovate.json'
  schedule:
    - cron: '23 4 * * 1'

# Same idiom as ci.yml: on a pull_request, head_ref names the branch so a superseded run is
# cancelled; on push/schedule head_ref is empty, so run_id makes the group unique and nothing
# is ever cancelled. That is what keeps a release or an in-flight Sigstore attestation safe
# without needing a special case - a branch-keyed group would be actively harmful here.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
