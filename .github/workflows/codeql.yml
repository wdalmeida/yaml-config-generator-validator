name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

# Same idiom as ci.yml: on a pull_request, head_ref names the branch so a superseded run is
# cancelled; on push/schedule head_ref is empty, so run_id makes the group unique and nothing
# is ever cancelled. That is what keeps a release or an in-flight Sigstore attestation safe
# without needing a special case - a branch-keyed group would be actively harmful here.
# Default-deny at the workflow level; `analyze` re-declares the scopes CodeQL actually needs.
# The classify and aggregate jobs need nothing beyond reading the repo.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changed-buckets.yml # zizmor: ignore[self-repository]

  analyze:
    needs: changes
    if: needs.changes.outputs.codeql == 'true' # JS/TS sources, or the config that compiles them
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"

  # The required status check for this workflow. `analyze` is a matrix job, and a matrix job
  # skipped at the top level never expands - so its per-language check runs are never created
  # and could not be required directly. This aggregate always runs and always reports, which
  # sidesteps that entirely.
  codeql-ok:
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          bad="$(printf '%s' "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | "\(.key) (\(.value.result))"')"
          if [ -n "$bad" ]; then
            echo "::error::CodeQL failed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
