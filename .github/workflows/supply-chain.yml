name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Generates a CycloneDX SBOM covering both the npm dependency tree (including dev
  # dependencies - these are "the tools" too) and the GitHub Actions used by this repo's own
  # workflows. Excludes the Go standard library version embedded in TypeScript 7's native
  # tsc binary (@typescript/typescript-*) - that's TypeScript's own build toolchain, not
  # something this repo can patch, and it otherwise drowns the SBOM in irrelevant Go stdlib
  # CVEs. Also excludes .github/workflows/*.yml files that ship *inside* node_modules
  # (other packages' own CI configs, not this repo's).
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Syft is installed and run directly (not via anchore/sbom-action) because that action's
      # own Syft download fetches https://raw.githubusercontent.com/anchore/syft/main/install.sh
      # (a mutable ref, no checksum on the script itself) at runtime - a commit-SHA pin on the
      # action itself doesn't cover this nested fetch (Plumber's ISSUE-714, confirmed by reading
      # the action's bundled dist/index.cjs). Downloaded and checksum-verified in-job instead,
      # same pattern as ci.yml's gitleaks install. See docs/supply-chain-security.md.
      - name: Install Syft (checksum-verified, no anchore/sbom-action)
        env:
          SYFT_VERSION: 1.51.0
        run: |
          set -euo pipefail
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${asset}" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${asset}"
          curl -fsSL -o "${tmp}/checksums.txt" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          ( cd "$tmp" && grep "$asset" checksums.txt | sha256sum -c - )
          tar -xzf "${tmp}/${asset}" -C "$tmp" syft
          chmod +x "${tmp}/syft"
          echo "$tmp" >> "$GITHUB_PATH"

      # anchore/sbom-action just runs `syft scan dir:<path> -o <format>` and writes the
      # captured stdout to output-file itself (confirmed by reading its bundled source) - so
      # this is a direct equivalent, with the same SYFT_* env vars (native Syft config, read
      # regardless of how the binary is invoked).
      - name: Generate SBOM (CycloneDX, via Syft)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_EXCLUDE: "./node_modules/**/.github/**,./dist/**"
          SYFT_SELECT_CATALOGERS: "-go-module-binary-cataloger,-file-metadata-cataloger,-file-digest-cataloger"
        run: syft scan dir:. -o cyclonedx-json > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json
          retention-days: 90

      # Attestations bind the SBOM/build to this exact commit+workflow run via Sigstore
      # (keyless signing, no secrets to manage) and publish to the repo's Attestations tab.
      # Only meaningful for the real build on main - not PRs, which may come from forks
      # without the write access this requires anyway.
      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/**
          sbom-path: sbom.cdx.json

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**

  # SCA: two independent OSV-Scanner (Apache-2.0, FOSS) passes against the OSV.dev vulnerability
  # database - one against the Syft-generated SBOM above, one against the checked-out repo's own
  # lockfile/source directly. These aren't redundant: the SBOM pass only sees whatever Syft chose
  # to catalog, while the source pass parses package-lock.json itself independently - a bug or gap
  # in Syft's cataloging wouldn't be caught by scanning only its own output. Each pass runs as its
  # own job (via the shared osv-scan.yml reusable workflow) so the source pass, which needs
  # nothing from the sbom job, isn't forced to wait on it.
  # sca-sbom and sca-source each restate this same permissions block rather than sharing it via
  # a YAML anchor - zizmor's own docs mark its anchor analysis as beta/less reliable, not worth
  # trading away for three duplicated lines in a repo that leans on zizmor as a security gate.
  sca-sbom:
    needs: sbom
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/osv-scan.yml
    with:
      download-sbom-artifact: true
      # --sbom was deprecated by osv-scanner in favor of --lockfile (which auto-detects SBOM
      # vs. lockfile format from the filename - sbom.cdx.json matches CycloneDX's naming
      # convention).
      scan-target: --lockfile=./sbom.cdx.json
      result-name: sbom
      category: osv-scanner-sbom

  sca-source:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/osv-scan.yml
    with:
      # node_modules/dist are excluded explicitly (not just relying on osv-scanner's default
      # .gitignore-aware skipping) so this stays correct even if a vendored dependency ships its
      # own package-lock.json - same defense-in-depth reasoning as the sbom job's SYFT_EXCLUDE.
      scan-target: |-
        --recursive
        --experimental-exclude=./node_modules,./dist
        .
      result-name: source
      category: osv-scanner-source

  # NOTE: if a third OSV-Scanner pass is ever added, add it to both needs: below and the if:
  # condition, or its failures won't be surfaced here.
  sca-result:
    needs: [sca-sbom, sca-source]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail job if either OSV-Scanner pass reported an issue (vulnerabilities found, a scan error, or the job itself didn't run)
        if: needs.sca-sbom.result != 'success' || needs.sca-source.result != 'success'
        run: exit 1

  # SAST: scans the actual source with Semgrep's OSS engine (LGPL-2.1) using only public,
  # login-free registry rulesets - no Semgrep account/token involved.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a # 1.173.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/react \
            --exclude=node_modules --exclude=dist \
            --metrics=off \
            --sarif --output=semgrep-results.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-scan-results
          path: semgrep-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
