name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node

  # Only runs when the standing release PR was just merged (release-please tagged a real
  # release, as opposed to every ordinary push to main just updating that PR).
  build-and-attach:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../dist.zip .

      # Syft is installed and run directly (not via anchore/sbom-action) because that action's
      # own Syft download fetches https://raw.githubusercontent.com/anchore/syft/main/install.sh
      # (a mutable ref, no checksum on the script itself) at runtime - a commit-SHA pin on the
      # action itself doesn't cover this nested fetch (Plumber's ISSUE-714, confirmed by reading
      # the action's bundled dist/index.cjs). Downloaded and checksum-verified in-job instead,
      # same pattern as ci.yml's gitleaks install. See docs/supply-chain-security.md.
      - name: Install Syft (checksum-verified, no anchore/sbom-action)
        env:
          SYFT_VERSION: 1.42.3
        run: |
          set -euo pipefail
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${asset}" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${asset}"
          curl -fsSL -o "${tmp}/checksums.txt" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          ( cd "$tmp" && grep "$asset" checksums.txt | sha256sum -c - )
          tar -xzf "${tmp}/${asset}" -C "$tmp" syft
          chmod +x "${tmp}/syft"
          echo "$tmp" >> "$GITHUB_PATH"

      # Attest the artifact people actually download from the Release - not just the
      # unrelated dist/ build supply-chain.yml attests on ordinary pushes to main.
      # anchore/sbom-action just runs `syft scan dir:<path> -o <format>` and writes the
      # captured stdout to output-file itself (confirmed by reading its bundled source) - so
      # this is a direct equivalent, with the same SYFT_* env vars (native Syft config, read
      # regardless of how the binary is invoked).
      - name: Generate SBOM for the release artifact (CycloneDX, via Syft)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_EXCLUDE: "./node_modules/**/.github/**,./dist/**"
          SYFT_SELECT_CATALOGERS: "-go-module-binary-cataloger,-file-metadata-cataloger,-file-digest-cataloger"
        run: syft scan dir:. -o cyclonedx-json > release-sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist.zip
          sbom-path: release-sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist.zip

      - name: Upload release artifact
        run: gh release upload "$TAG_NAME" dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
