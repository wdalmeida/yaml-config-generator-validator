name: OSV-Scanner pass

# Shared by supply-chain.yml's sca-sbom/sca-source jobs so the SBOM pass and the source pass -
# which differ only in scan target and result naming - don't have to keep two hand-duplicated
# scan -> upload-artifact -> upload-sarif step sequences in sync.

on:
  workflow_call:
    inputs:
      scan-target:
        description: osv-scanner CLI args identifying what to scan (e.g. --lockfile=./sbom.cdx.json, or --recursive .) - the --format/--output-file flags are added by this workflow, derived from result-name
        required: true
        type: string
      result-name:
        description: Suffix used for the uploaded artifact name and the SARIF file (osv-results-<result-name>.sarif)
        required: true
        type: string
      category:
        description: Code scanning SARIF category for this pass
        required: true
        type: string
      download-sbom-artifact:
        description: Download the sbom.cdx.json artifact from the sbom job before scanning, instead of checking out the repository
        required: false
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - if: ${{ !inputs.download-sbom-artifact }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.download-sbom-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom.cdx.json

      # The CLI, not google/osv-scanner-action: that action runs the same binary inside a
      # container image pulled from GHCR on every job, which measured 17-18s per pass (two
      # passes per run) against ~1s to fetch and verify the binary here - and an anonymous
      # registry pull counts against a rate limit shared with every other runner on that IP.
      # Same install pattern as gitleaks/Syft/Trivy: exact version, checksum-verified.
      - name: Install OSV-Scanner (checksum-verified)
        env:
          OSV_SCANNER_VERSION: 2.5.1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL -o "${tmp}/osv-scanner" "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/osv-scanner_SHA256SUMS"
          # The checksum file names the release asset; rename it to the local filename first
          # so this stays a real check rather than a silently skipped one.
          ( cd "$tmp" && grep 'osv-scanner_linux_amd64$' checksums.txt | sed 's|osv-scanner_linux_amd64|osv-scanner|' | sha256sum -c - )
          chmod +x "${tmp}/osv-scanner"
          echo "$tmp" >> "$GITHUB_PATH"

      - name: Scan for known vulnerabilities (OSV-Scanner)
        id: osv
        # No continue-on-error here: a real finding or scan error fails this job naturally, which
        # is what the caller's sca-result gate checks via needs.*.result. The if: always() upload
        # steps below still run regardless of this step's outcome.
        env:
          SCAN_TARGET: ${{ inputs.scan-target }}
          RESULT_NAME: ${{ inputs.result-name }}
        run: |
          set -euo pipefail
          # SCAN_TARGET is this workflow's own input (a literal in each caller), word-split
          # deliberately: it carries several flags, and one pass passes three of them.
          # shellcheck disable=SC2086
          osv-scanner scan source $SCAN_TARGET \
            --format=sarif \
            --output-file="osv-results-${RESULT_NAME}.sarif" \
            --verbosity=error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv-scan-results-${{ inputs.result-name }}
          path: osv-results-${{ inputs.result-name }}.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: osv-results-${{ inputs.result-name }}.sarif
          category: ${{ inputs.category }}
