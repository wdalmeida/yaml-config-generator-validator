name: OSV-Scanner pass

# Shared by supply-chain.yml's sca-sbom/sca-source jobs so the SBOM pass and the source pass -
# which differ only in scan target and result naming - don't have to keep two hand-duplicated
# scan -> upload-artifact -> upload-sarif step sequences in sync.

on:
  workflow_call:
    inputs:
      scan-args:
        description: osv-scanner CLI args (the --format/--output-file flags and scan target)
        required: true
        type: string
      result-name:
        description: Suffix used for the uploaded artifact name and the SARIF file (must match the --output-file in scan-args, e.g. osv-results-<result-name>.sarif)
        required: true
        type: string
      category:
        description: Code scanning SARIF category for this pass
        required: true
        type: string
      download-sbom-artifact:
        description: Download the sbom.cdx.json artifact from the sbom job before scanning
        required: false
        type: boolean
        default: false
    outputs:
      outcome:
        description: Outcome of the osv-scanner step (success or failure)
        value: ${{ jobs.scan.outputs.outcome }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    outputs:
      outcome: ${{ steps.osv.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.download-sbom-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom.cdx.json

      - name: Scan for known vulnerabilities (OSV-Scanner)
        id: osv
        continue-on-error: true # don't abort here - the upload steps below must still run; the caller decides whether to fail the job
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: ${{ inputs.scan-args }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv-scan-results-${{ inputs.result-name }}
          path: osv-results-${{ inputs.result-name }}.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: osv-results-${{ inputs.result-name }}.sarif
          category: ${{ inputs.category }}
