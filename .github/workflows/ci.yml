name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run lint:size
      - run: npm run test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 90

      # oxlint has first-class SARIF support (--format=sarif) - run it again in that mode so
      # findings also show up in Security > Code scanning, not just the human-readable log
      # above. `if: always()` so this still runs (and still reports) even if `npm run lint`
      # failed the job.
      - name: oxlint (SARIF, for code scanning)
        if: always()
        run: npx oxlint --format=sarif > oxlint-results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oxlint-results
          path: oxlint-results.sarif
          retention-days: 90
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: oxlint-results.sarif
          category: oxlint

  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:schemas

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # lint:md always writes markdownlint-results.sarif too (see .markdownlint-cli2.jsonc's
      # outputFormatters) - upload it for code scanning even if this step fails the job.
      - name: markdownlint
        id: markdownlint
        run: npm run lint:md
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: markdownlint-results
          path: markdownlint-results.sarif
          retention-days: 90
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true
        with:
          sarif_file: markdownlint-results.sarif
          category: markdownlint
      - name: Fail if markdownlint found issues
        if: steps.markdownlint.outcome == 'failure'
        run: exit 1
      - run: npm run lint:links

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 # script pinned to tag v1.7.12
          ./actionlint -color
        # No native SARIF output from actionlint itself (only a Go-template `-format`); findings
        # already surface as a failing check + readable log, which is sufficient here.

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI itself is MIT-licensed (FOSS); gitleaks/gitleaks-action is a separate,
      # proprietary product under gitleaks-action's own EULA. Running the CLI directly keeps
      # this FOSS end-to-end and gives native SARIF output, verified against the published
      # checksum rather than trusted blindly.
      - name: Install gitleaks (FOSS CLI)
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan for secrets (gitleaks)
        id: gitleaks
        run: ./gitleaks detect --source . --report-format=sarif --report-path=gitleaks-results.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Fail if gitleaks found secrets
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # zizmor is a GitHub Actions-specific security linter (Apache-2.0/MIT) - it catches
      # things neither actionlint (syntax/shellcheck) nor Semgrep's generic rulesets do:
      # template injection via untrusted context values, overly broad workflow permissions,
      # impostor commits, credential persistence through checkout. Installed from PyPI
      # (registry-integrity-checked, exact version pinned) rather than a raw binary download.
      - run: pip install zizmor==1.29.0

      - name: zizmor (SARIF, for code scanning)
        id: zizmor
        run: zizmor . --format=sarif --output=zizmor-results.sarif
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zizmor-results
          path: zizmor-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

      - name: Fail if zizmor found issues
        if: steps.zizmor.outcome == 'failure'
        run: exit 1
