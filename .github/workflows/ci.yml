name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Works out which categories of file a PR touched, so the jobs below can skip what a change
  # cannot possibly affect. Deliberately gates `pull_request` ONLY - every other event (push to
  # main, the crons, a manual run) gets all-true, so a mis-defined pattern is caught after the
  # merge rather than never. See tools/internal/buckets, which also explains why any .github/**
  # change forces every bucket on.
  #
  # ci-ok below has this job in its `needs:`, so a failure here goes red rather than silently
  # skipping every job it gates.
  changes:
    uses: ./.github/workflows/changed-buckets.yml # zizmor: ignore[self-repository]

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true' # the app sources, its build/lint config, or the npm tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run lint:size
      - run: npm run test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 90

      # oxlint has first-class SARIF support (--format=sarif) - run it again in that mode so
      # findings also show up in Security > Code scanning, not just the human-readable log
      # above. `if: always()` so this still runs (and still reports) even if `npm run lint`
      # failed the job.
      - name: oxlint (SARIF, for code scanning)
        if: always()
        run: npx oxlint --format=sarif > oxlint-results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oxlint-results
          path: oxlint-results.sarif
          retention-days: 90
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: oxlint-results.sarif
          category: oxlint

  # No `npm ci` here any more: this check used to need ajv, and now needs nothing but the Go
  # module and the JSON files it reads.
  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true' # the schema/onboarding JSON, or the npm tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - run: go run ./tools/cmd/validate-schemas

  # The tools/ Go module: the CI logic that used to be shell and inline Python. Nothing else in
  # this repo is Go, so this job is the only thing that compiles it - and container.yml's scan
  # gates run it on every push, which makes "it builds" a release-blocking property rather than
  # a nicety.
  #
  # Deliberately ungated for now, like every other job here: the `changes` job's buckets are not
  # wired to `if:` conditions yet (that is the follow-up described in docs/releasing.md). When
  # they are, note that a tools/ change already forces every bucket on - see
  # tools/internal/buckets - so this job needs a bucket of its own only if it should skip on a
  # src/-only change.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' # the Go module itself
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum

      # gofmt is not a style preference here, it is the diff hygiene that keeps a Renovate bump
      # from arriving with unrelated reformatting in it. -l lists offenders and exits 0, so the
      # check has to be the emptiness of the output.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Renders the Helm chart and checks every manifest it produces against the real Kubernetes
  # API schemas. `helm lint` on its own only inspects the chart's own structure - it passes a
  # Deployment with a misspelled field quite happily - so kubeconform (Apache-2.0, FOSS) is
  # what actually catches a broken manifest. Both are checksum-verified binaries, the same
  # pattern as gitleaks above.
  #
  # Every values file under charts/*/ci/ is rendered as well as the defaults: the optional
  # templates (Ingress, HPA, PDB, NetworkPolicy) are off by default, so without those a
  # template that only breaks when they are enabled would reach main untested.
  helm:
    needs: changes
    if: needs.changes.outputs.charts == 'true' # the chart or its kube-linter config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm and kubeconform (checksum-verified)
        env:
          HELM_VERSION: 4.3.0
          KUBECONFORM_VERSION: 0.8.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          # Helm publishes a .sha256sum beside each asset, already in `sha256sum -c` format.
          helm_asset="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "${tmp}/${helm_asset}" "https://get.helm.sh/${helm_asset}"
          curl -fsSL -o "${tmp}/${helm_asset}.sha256sum" "https://get.helm.sh/${helm_asset}.sha256sum"
          ( cd "$tmp" && sha256sum -c "${helm_asset}.sha256sum" )
          tar -xzf "${tmp}/${helm_asset}" -C "$tmp" linux-amd64/helm
          install -m 0755 "${tmp}/linux-amd64/helm" "${tmp}/helm"

          kc_asset="kubeconform-linux-amd64.tar.gz"
          kc_base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          curl -fsSL -o "${tmp}/${kc_asset}" "${kc_base}/${kc_asset}"
          curl -fsSL -o "${tmp}/CHECKSUMS" "${kc_base}/CHECKSUMS"
          ( cd "$tmp" && grep " ${kc_asset}\$" CHECKSUMS | sha256sum -c - )
          tar -xzf "${tmp}/${kc_asset}" -C "$tmp" kubeconform
          chmod +x "${tmp}/kubeconform"

          echo "$tmp" >> "$GITHUB_PATH"

      # Extracted straight into HELM_PLUGINS rather than installed with `helm plugin install`,
      # which would fetch the same tarball again over the network unverified and then run the
      # release's own install hook. The release does publish a checksum file, but it lists its
      # assets as ./_dist/<name>, so the digest is looked up by name instead of the whole file
      # being piped through `sha256sum -c`.
      - name: Install helm-unittest (checksum-verified)
        env:
          HELM_UNITTEST_VERSION: 1.1.2
        run: |
          set -euo pipefail
          # helm-unittest is a Helm plugin, not a binary on PATH, so it goes in HELM_PLUGINS
          # rather than on $GITHUB_PATH - under the runner temp directory rather than the
          # workspace, so it never lands in the checked-out tree. Exported here rather than in
          # a job-level env block, which cannot see the runner context.
          echo "HELM_PLUGINS=${RUNNER_TEMP}/helm-plugins" >> "$GITHUB_ENV"
          export HELM_PLUGINS="${RUNNER_TEMP}/helm-plugins"
          tmp="$(mktemp -d)"
          asset="helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION}.tgz"
          base="https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}"
          curl -fsSL -o "${tmp}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${tmp}/checksum.sha" "${base}/helm-unittest-checksum.sha"
          want="$(awk -v a="*./_dist/${asset}" '$2 == a { print $1 }' "${tmp}/checksum.sha")"
          # An asset the checksum file doesn't mention would otherwise verify vacuously.
          test -n "$want"
          echo "${want}  ${tmp}/${asset}" | sha256sum -c -
          mkdir -p "${HELM_PLUGINS}/unittest"
          tar -xzf "${tmp}/${asset}" -C "${HELM_PLUGINS}/unittest"
          chmod +x "${HELM_PLUGINS}/unittest/untt-linux-amd64"
          helm plugin list

      # kube-linter publishes no checksums file - only a per-asset Sigstore bundle, and those
      # are bare blob signatures (a messageSignature, no SLSA provenance predicate), so
      # `gh attestation verify` cannot consume them and verifying them needs cosign plus a
      # trust root this repo doesn't otherwise carry. GitHub's own release API does report
      # each asset's sha256, which is the same trust root a checksums.txt inside the release
      # would have had - same uploader, same API - so that is what this verifies against, and
      # it has the useful property of tracking a Renovate version bump by itself.
      - name: Install kube-linter (digest-verified)
        env:
          KUBE_LINTER_VERSION: 0.8.3
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tag="v${KUBE_LINTER_VERSION}"
          asset="kube-linter-linux"
          digest="$(gh api "repos/stackrox/kube-linter/releases/tags/${tag}" \
            --jq ".assets[] | select(.name == \"${asset}\") | .digest")"
          # An asset with no digest reported would otherwise verify vacuously.
          test -n "$digest"
          curl -fsSL -o "${tmp}/kube-linter" \
            "https://github.com/stackrox/kube-linter/releases/download/${tag}/${asset}"
          echo "${digest#sha256:}  ${tmp}/kube-linter" | sha256sum -c -
          chmod +x "${tmp}/kube-linter"
          echo "$tmp" >> "$GITHUB_PATH"

      # The first of four checks on the chart, and the only one that asserts what the
      # templates actually produce. helm lint answers "is the chart well-formed", kubeconform
      # "is the output a valid Kubernetes object", kube-linter "is it a sensible one" - all
      # three pass a chart whose values stopped reaching the manifest. Suites are in
      # charts/*/tests/.
      - name: helm unittest
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            helm unittest "$chart"
          done

      - name: helm lint
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            helm lint "$chart"
            for values in "$chart"ci/*-values.yaml; do
              [ -e "$values" ] || continue
              helm lint "$chart" --values "$values"
            done
          done

      # -strict rejects a manifest with any field the schema doesn't know, which is the whole
      # point: a typo in a Deployment field is silently ignored by the API server otherwise.
      # The pinned -kubernetes-version picks the schema set to check against; it is not a
      # statement about which clusters the chart supports (Chart.yaml's kubeVersion is).
      - name: helm template | kubeconform
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            echo "::group::${chart} (default values)"
            helm template release "$chart" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
            echo "::endgroup::"
            for values in "$chart"ci/*-values.yaml; do
              [ -e "$values" ] || continue
              echo "::group::${chart} ($(basename "$values"))"
              helm template release "$chart" --values "$values" \
                | kubeconform -strict -summary -kubernetes-version 1.31.0
              echo "::endgroup::"
            done
          done

      # kubeconform answers "is this a valid Kubernetes object"; kube-linter (Apache-2.0,
      # FOSS) answers "is this a sensible one" - a container that can escalate privileges, a
      # missing probe, a moving image tag, a PodDisruptionBudget that can deadlock a node
      # drain. Its config, including the two exclusions and why each one is there, is
      # .kube-linter.yaml, which it reads from the working directory.
      - name: kube-linter (SARIF, for code scanning)
        id: kube-linter
        run: kube-linter lint charts/ --format sarif > kube-linter-results.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kube-linter-results
          path: kube-linter-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: kube-linter-results.sarif
          category: kube-linter

      # The values files get linted as rendered manifests, for the same reason kubeconform
      # reads them: the default render has no Ingress, HPA, PDB or NetworkPolicy in it, and
      # two of the findings that shaped this chart only appeared once those were switched on.
      - name: kube-linter (rendered values files)
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            for values in "$chart"ci/*-values.yaml; do
              [ -e "$values" ] || continue
              echo "::group::${chart} ($(basename "$values"))"
              helm template release "$chart" --values "$values" | kube-linter lint -
              echo "::endgroup::"
            done
          done

      - name: Fail if kube-linter found issues
        if: steps.kube-linter.outcome == 'failure'
        run: exit 1

  markdown:
    needs: changes
    if: needs.changes.outputs.markdown == 'true' # a *.md file or markdownlint config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # lint:md always writes markdownlint-results.sarif too (see .markdownlint-cli2.jsonc's
      # outputFormatters) - upload it for code scanning even if this step fails the job.
      - name: markdownlint
        id: markdownlint
        run: npm run lint:md
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: markdownlint-results
          path: markdownlint-results.sarif
          retention-days: 90
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true
        with:
          sarif_file: markdownlint-results.sarif
          category: markdownlint
      - name: Fail if markdownlint found issues
        if: steps.markdownlint.outcome == 'failure'
        run: exit 1

  # Relative links only - `.markdown-link-check.json` ignores http(s), so this is a filesystem
  # check: instant, offline, and with no false positives to learn to ignore. It is also the only
  # half of link checking a pull request can actually break, by moving a file something links to.
  # External URLs are checked weekly by link-check.yml instead, because link rot is driven by
  # time rather than by the commit. Its bucket is wider than markdown's for exactly this reason:
  # docs link out to charts/, tools/ and LICENSE.
  links:
    needs: changes
    if: needs.changes.outputs.links == 'true' # a *.md file, or a non-markdown file the docs link to
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      # markdown-link-check still resolves every link; the Go command is the loop around it and
      # the exit-code aggregation `find -exec` could not do.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: go run ./tools/cmd/check-markdown-links

  # renovate.json is read by nothing else in CI, so before this job the only feedback on a typo
  # was Renovate opening a Config Warning issue after the merge. Runs the official validator
  # rather than a hand-rolled schema check, because Renovate's config has semantics no JSON
  # Schema expresses (preset resolution, manager-scoped option validity).
  #
  # It pulls ~600 packages for one file, which is why it is bucket-gated: renovate.json changes
  # a handful of times a year, and on every other PR this job does not start at all.
  renovate:
    needs: changes
    if: needs.changes.outputs.renovate == 'true' # renovate.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run lint:renovate

  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true' # package.json / package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No `npm ci`: `npm audit` resolves the tree from the lockfile, so installing it first
      # bought nothing but a minute. --package-lock-only says that out loud rather than relying
      # on how npm happens to behave with no node_modules present.
      - run: npm audit --audit-level=high --package-lock-only

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' # a workflow file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 # script SHA pinned to this same tag
          ./actionlint -color
      # actionlint has nothing to say about ci-ok's needs: list, and that list is now the only
      # thing standing between a new job and being enforced by nothing. Lives here rather than
      # in its own job because it is a workflow-YAML lint by any other name.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - run: go run ./tools/cmd/check-ci-gate
        # No native SARIF output from actionlint itself (only a Go-template `-format`); findings
        # already surface as a failing check + readable log, which is sufficient here.

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI itself is MIT-licensed (FOSS); gitleaks/gitleaks-action is a separate,
      # proprietary product under gitleaks-action's own EULA. Running the CLI directly keeps
      # this FOSS end-to-end and gives native SARIF output, verified against the published
      # checksum rather than trusted blindly.
      - name: Install gitleaks (FOSS CLI)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${checksums}"
          grep "$asset" "$checksums" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          chmod +x gitleaks

      - name: Scan for secrets (gitleaks)
        id: gitleaks
        run: ./gitleaks detect --source . --report-format=sarif --report-path=gitleaks-results.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Fail if gitleaks found secrets
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' # a workflow file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # zizmor is a GitHub Actions-specific security linter (Apache-2.0/MIT) - it catches
      # things neither actionlint (syntax/shellcheck) nor Semgrep's generic rulesets do:
      # template injection via untrusted context values, overly broad workflow permissions,
      # impostor commits, credential persistence through checkout. Installed from PyPI
      # (registry-integrity-checked, exact version pinned) rather than a raw binary download.
      - run: pip install zizmor==1.30.1

      # Two runs, because zizmor's SARIF mode exits 0 even when it has findings. This job
      # used to have only the SARIF run, gated on its `outcome` - a gate that could never
      # fire, and two real findings sat unreported behind it. The plain run is the gate (it
      # exits non-zero on findings, which is how `just zizmor` has always read it); the SARIF
      # run is the report, with `if: always()` so it still uploads when the gate fails. Same
      # shape as the oxlint steps in the `test` job above.
      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: zizmor (SARIF, for code scanning)
        if: always()
        run: zizmor . --format=sarif > zizmor-results.sarif
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zizmor-results
          path: zizmor-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor


  plumber:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' # a workflow file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plumber (MPL-2.0, FOSS) is a second, independent GitHub Actions security scanner -
      # a distinct engine/ruleset from zizmor, checking things it doesn't: exposed/unmasked
      # secrets, mutable remote-code execution nested inside third-party actions, known-CVE
      # action versions, and branch protection. Blocking by default (min-points 100, any
      # finding fails) - see docs/supply-chain-security.md "Known, accepted Plumber finding"
      # for a real, currently-unfixed High finding (ISSUE-714) this exposes as a failing check
      # until it's closed. Self-contained: verifies its own binary against checksums.txt + a
      # Sigstore/SLSA attestation before running, and handles its own SARIF/artifact upload
      # internally.
      - uses: getplumber/plumber@7cc2c2fe18af5a9f55e28528b8fba0fecee3be79 # v0.4.56

  # The single required status check for `main`, and the reason every job above can be skipped
  # safely. It always runs, so it always reports a real success or failure - nothing here relies
  # on GitHub's "a skipped job satisfies a required check" behaviour, and a workflow-level
  # `paths:` filter (which would leave a required check Pending forever, blocking the merge) is
  # never needed on this file.
  #
  # Two properties follow from listing every job in `needs:` rather than naming contexts in the
  # repository ruleset:
  #   - a new job is enforced the moment it lands here, with no repo-settings change. The
  #     previous per-context list had already drifted: `helm` and `plumber` were enforced by
  #     nothing at all.
  #   - Renovate's automerge waits on this one check, so it transitively waits on all of them.
  #
  # `skipped` is a pass - that is the whole point. Same shape as supply-chain.yml's sca-result,
  # except that one treats skipped as a failure because there a skipped OSV pass means the scan
  # genuinely did not happen.
  ci-ok:
    if: always()
    needs:
      - changes
      - test
      - schemas
      - go
      - helm
      - markdown
      - links
      - audit
      - renovate
      - actionlint
      - gitleaks
      - zizmor
      - plumber
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          bad="$(printf '%s' "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | "\(.key) (\(.value.result))"')"
          if [ -n "$bad" ]; then
            echo "::error::CI failed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
