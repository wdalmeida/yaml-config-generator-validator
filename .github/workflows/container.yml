name: Container

# Builds the Containerfile image on every push/PR, proves it actually serves the app
# safely, scans it with two independent vulnerability databases, and - only on push to
# main - publishes it to GHCR with SLSA build provenance and an SBOM attestation.
#
# Nothing here gates the app itself: the site ships via GitHub Pages (deploy.yml). This
# job exists so the container path can't silently rot. See docs/container.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Static lint of the Containerfile itself (hadolint, GPL-3.0/FOSS): missing USER,
  # unpinned base tags, shell anti-patterns in RUN, non-numeric UIDs. Installed as a
  # checksum-verified binary rather than via a wrapper action - same pattern as ci.yml's
  # gitleaks and supply-chain.yml's Syft.
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hadolint (checksum-verified)
        env:
          HADOLINT_VERSION: 2.15.1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          base="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}"
          curl -fsSL -o "${tmp}/hadolint" "${base}/hadolint-linux-x86_64"
          curl -fsSL -o "${tmp}/checksums.sha256" "${base}/checksums.sha256"
          # The published checksum file names the release asset; rename it to the local
          # filename before verifying so this stays a real check, not a skipped one.
          ( cd "$tmp" && grep 'hadolint-linux-x86_64$' checksums.sha256 | sed 's|hadolint-linux-x86_64|hadolint|' | sha256sum -c - )
          chmod +x "${tmp}/hadolint"
          echo "$tmp" >> "$GITHUB_PATH"

      - name: hadolint (SARIF, for code scanning)
        id: hadolint
        run: hadolint --format sarif Containerfile > hadolint-results.sarif
        continue-on-error: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hadolint-results
          path: hadolint-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

      - name: Fail if hadolint found issues
        if: steps.hadolint.outcome == 'failure'
        run: exit 1

  # Builds with buildah (preinstalled on the runner, no action wrapper), then runs the
  # image the same locked-down way docs/container.md tells people to run it and asserts
  # it actually works: health endpoint, the real page, non-root UID, and the security
  # headers container/nginx.conf sets. A regression in that config is a silently broken
  # deployment otherwise - nothing else in this repo exercises it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # layer cache only - the image itself is pushed by the publish job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Layer cache, kept in GHCR rather than actions/cache: buildah reads and writes it in
      # the registry's own format, so there's no tarball to pack, upload and unpack, and the
      # cache is shared across branches instead of being scoped to one by GitHub's cache
      # isolation rules. Every run reads it; only a push to main writes it, so a PR can
      # never poison what other branches build against. A miss is not an error - buildah
      # just builds every layer - so a fork PR that can't reach the cache still builds.
      - name: Log in to GHCR (layer cache)
        id: cache-login
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: buildah login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"

      # Layer timestamps and the created label both come from the commit date rather than
      # wall-clock time, so two builds of the same commit don't differ purely because they
      # ran at different moments. That's as far as this goes toward reproducibility - the
      # npm install underneath isn't bit-for-bit guaranteed - but it makes an actual
      # content difference between two builds of one commit visible instead of drowned in
      # timestamp churn.
      - name: Build image (buildah, OCI format, reproducible timestamps)
        env:
          IMAGE_REF: localhost/yaml-config-generator-validator:ci
          CACHE_LOGGED_IN: ${{ steps.cache-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          cache_ref="ghcr.io/${GITHUB_REPOSITORY,,}/build-cache"

          args=(--format oci --timestamp "$epoch" --pull=always)
          if [ "$CACHE_LOGGED_IN" = "true" ]; then
            # --layers is what makes each instruction its own cacheable layer at all; without
            # it buildah squashes the stage and there is nothing to reuse. The npm ci layer is
            # the one that pays off: it only rebuilds when package-lock.json changes.
            args+=(--layers --cache-from "$cache_ref")
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              args+=(--cache-to "$cache_ref")
            fi
          fi

          buildah bud \
            "${args[@]}" \
            --build-arg IMAGE_CREATED="$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_REVISION="$GITHUB_SHA" \
            --build-arg IMAGE_VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}" \
            --tag "$IMAGE_REF" \
            .

      - name: Smoke test the running container
        env:
          IMAGE_REF: localhost/yaml-config-generator-validator:ci
        run: |
          set -euo pipefail
          # Dump the container's own log whichever way this ends - a failed assertion is
          # usually explained by something nginx said at startup.
          trap 'podman logs smoke || true; podman rm -f smoke >/dev/null 2>&1 || true' EXIT

          podman run -d --name smoke -p 8080:8080 \
            --read-only --tmpfs /tmp \
            --cap-drop=ALL --security-opt=no-new-privileges \
            "$IMAGE_REF"

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          echo "::group::Assertions"
          curl -fsS http://localhost:8080/healthz | grep -qx ok
          # The SPA itself, not just nginx's default page.
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # Unknown paths fall back to index.html rather than 404ing.
          curl -fsS http://localhost:8080/does-not-exist | grep -q '<div id="root">'

          headers="$(curl -fsSI http://localhost:8080/)"
          grep -qi '^content-security-policy:' <<<"$headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^referrer-policy:' <<<"$headers"
          # server_tokens off - no nginx version banner to fingerprint.
          if grep -qiE '^server: nginx/' <<<"$headers"; then
            echo "nginx version leaked in Server header" >&2
            exit 1
          fi

          # Runs as the unprivileged nginx user, with a read-only root filesystem
          # (the run above would have failed outright if it needed to write outside /tmp).
          test "$(podman exec smoke id -u)" = "101"
          echo "::endgroup::"

      # Handed to the scan and publish jobs so neither has to rebuild - they scan and push
      # the exact bytes that were smoke-tested here. Two formats of one image: skopeo pushes
      # the OCI archive (native mediatypes, no conversion), while both scanners read a
      # Docker-format archive - neither Trivy's nor OSV-Scanner's --input/--archive accepts
      # an OCI archive tarball ("file manifest.json not found in tar").
      - name: Export the image (OCI archive to push, Docker archive to scan)
        env:
          IMAGE_REF: localhost/yaml-config-generator-validator:ci
        run: |
          set -euo pipefail
          podman save --format oci-archive -o image.tar "$IMAGE_REF"
          podman save --format docker-archive -o image-docker.tar "$IMAGE_REF"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image
          path: |
            image.tar
            image-docker.tar
          retention-days: 7 # intermediate hand-off between jobs, not a published artifact

      - name: Install Syft (checksum-verified, no anchore/sbom-action)
        env:
          SYFT_VERSION: 1.51.0
        run: |
          set -euo pipefail
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${asset}" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${asset}"
          curl -fsSL -o "${tmp}/checksums.txt" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          ( cd "$tmp" && grep "$asset" checksums.txt | sha256sum -c - )
          tar -xzf "${tmp}/${asset}" -C "$tmp" syft
          chmod +x "${tmp}/syft"
          echo "$tmp" >> "$GITHUB_PATH"

      # Describes the built image - the Alpine apk packages and the shipped dist/ files,
      # not the npm tree supply-chain.yml's SBOM already covers. This is a deliverable
      # (published, and attested in the publish job), deliberately NOT the input to either
      # scan below: an SBOM lists apk *binary* packages (libcrypto3, libssl3) while the
      # advisories are keyed on the *source* package (openssl), and that mapping only
      # survives when a scanner reads the image's own apk metadata. See docs/container.md.
      - name: Generate SBOM of the image (CycloneDX, via Syft)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: syft scan oci-archive:image.tar -o cyclonedx-json > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Name fixed by osv-scan.yml's download-sbom-artifact input, which the sca job
          # below reuses.
          name: sbom.cdx.json
          path: sbom.cdx.json
          retention-days: 90

  # Trivy (Apache-2.0, FOSS) against the built image: OS + language package CVEs, embedded
  # secrets, and image misconfiguration. Deliberately a different database and engine from
  # the OSV pass below - same "two independent passes" reasoning as supply-chain.yml's
  # sca-sbom/sca-source split.
  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      # Trivy pulls a ~110 MB vulnerability database plus a checks bundle from a registry on
      # every cold run - the single largest download in this workflow, and an anonymous
      # registry pull, so it counts against a rate limit shared with every other runner on
      # that IP. Cached per day: Trivy still reads the DB's own metadata and re-downloads if
      # it considers it stale, so a cache hit never means scanning against an old database -
      # it only means not fetching one that's already current.
      # Keyed by day, not by run id: an exact hit means no new cache entry is written, so this
      # stays one ~110 MB entry per day instead of one per run churning through the repo's
      # 10 GB cache quota.
      - name: Stamp today's date for the cache key
        id: today
        run: echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache the Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.today.outputs.stamp }}
          restore-keys: trivy-db-

      - name: Install Trivy (checksum-verified)
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tmp="$(mktemp -d)"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL -o "${tmp}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          ( cd "$tmp" && grep "$asset" checksums.txt | sha256sum -c - )
          tar -xzf "${tmp}/${asset}" -C "$tmp" trivy
          chmod +x "${tmp}/trivy"
          echo "$tmp" >> "$GITHUB_PATH"

      # Two passes over the same cached database: the first reports everything it can see
      # (SARIF, for code scanning), the second is the gate. Splitting them keeps low/medium
      # findings visible without turning every unfixed advisory into a red build.
      - name: Trivy (SARIF, for code scanning)
        run: |
          trivy image --input image-docker.tar \
            --scanners vuln,secret,misconfig \
            --format sarif --output trivy-results.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Fail on fixable HIGH/CRITICAL findings
        run: |
          trivy image --input image-docker.tar \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

  # Second, independent vulnerability pass: OSV-Scanner against the OSV.dev database, a
  # different engine and a different data source from Trivy above.
  #
  # It scans the IMAGE, not the SBOM - unlike supply-chain.yml's npm passes, which do use
  # the SBOM (and are unaffected by this). Feeding it the image SBOM is a silent false
  # negative for OS packages: the SBOM lists apk binary subpackages (libcrypto3, libssl3)
  # carrying "upstream=openssl" only as a purl qualifier, while OSV's Alpine advisories are
  # keyed on the source package (openssl) - so the lookup misses. Measured on this repo's
  # own image, same scanner and same database, only the input differing: SBOM input -> "no
  # issues found"; image input -> 15 vulnerabilities (1 critical, 8 high) on openssl
  # 3.5.6-r0, the exact CVE Trivy failed the build on. Scanning the image lets OSV-Scanner
  # read apk's own metadata and do the binary -> source mapping itself. It also drops ~700
  # lines of "Neither CPE nor PURL found for package" noise the SBOM path emits for every
  # file component Syft catalogs.
  sca:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      # Installed directly rather than via google/osv-scanner-action (which the npm passes
      # still use): the action has no image-scanning mode, and a checksum-verified binary is
      # this workflow's pattern for every other tool anyway.
      - name: Install OSV-Scanner (checksum-verified)
        env:
          OSV_SCANNER_VERSION: 2.5.1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL -o "${tmp}/osv-scanner" "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/osv-scanner_SHA256SUMS"
          # The checksum file names the release asset; rename it to the local filename first
          # so this stays a real check rather than a silently skipped one.
          ( cd "$tmp" && grep 'osv-scanner_linux_amd64$' checksums.txt | sed 's|osv-scanner_linux_amd64|osv-scanner|' | sha256sum -c - )
          chmod +x "${tmp}/osv-scanner"
          echo "$tmp" >> "$GITHUB_PATH"

      # Two runs over the same scan, mirroring the Trivy job above: SARIF reports everything
      # for code scanning, JSON drives the gate. A finding makes osv-scanner exit non-zero,
      # which is not itself a failure here - the gate below decides.
      # --verbosity error: the findings go to the output file either way, so the only thing
      # the default level adds to the log is a per-layer "Starting filesystem walk" trace.
      # The gate step below prints the human-readable summary instead.
      - name: OSV-Scanner (SARIF, for code scanning)
        run: |
          osv-scanner scan image --archive image-docker.tar \
            --format sarif --output-file osv-results-container.sarif \
            --verbosity error || true
          test -s osv-results-container.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv-scan-results-container
          path: osv-results-container.sarif
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        continue-on-error: true # code scanning requires GHAS on private repos - don't fail CI over it
        with:
          sarif_file: osv-results-container.sarif
          category: osv-scanner-container

      # Held to exactly the bar Trivy's gate uses - fixable, HIGH or CRITICAL (CVSS >= 7.0)
      # - so the two engines fail the build for the same class of finding rather than one of
      # them reddening it over an advisory nobody can act on. OSV-Scanner has no severity or
      # --ignore-unfixed flag of its own, hence reading its JSON: a vulnerability counts only
      # if its group's max_severity is >= 7.0 and its affected ranges carry a "fixed" event.
      - name: Fail on fixable HIGH/CRITICAL findings
        run: |
          osv-scanner scan image --archive image-docker.tar \
            --format json --output-file osv-results-container.json \
            --verbosity error || true
          python3 - <<'EOF'
          import json, sys

          with open('osv-results-container.json') as handle:
              report = json.load(handle)

          blocking = []
          reported = 0
          for result in report.get('results', []):
              for package in result.get('packages', []):
                  severity_by_id = {
                      vuln_id: float(group['max_severity'])
                      for group in package.get('groups', [])
                      if group.get('max_severity')
                      for vuln_id in group.get('ids', [])
                  }
                  for vuln in package.get('vulnerabilities', []):
                      reported += 1
                      severity = severity_by_id.get(vuln['id'], 0.0)
                      fixed = any(
                          'fixed' in event
                          for affected in vuln.get('affected', [])
                          for range_ in affected.get('ranges', [])
                          for event in range_.get('events', [])
                      )
                      if severity >= 7.0 and fixed:
                          name = package['package']['name']
                          version = package['package']['version']
                          blocking.append(f"{vuln['id']} {name} {version} (CVSS {severity})")

          for finding in sorted(set(blocking)):
              print(finding)
          print(f'{reported} vulnerabilities reported, {len(set(blocking))} of them fixable HIGH/CRITICAL')
          sys.exit(1 if blocking else 0)
          EOF

  # Publishes to GHCR only from main, and only behind every check above. The image is
  # pushed byte-for-byte from the archive the build job smoke-tested (skopeo copy, no
  # rebuild), then attested: build provenance (SLSA - which workflow, which commit, which
  # runner produced this digest) and the SBOM, both signed keyless through Sigstore and
  # pushed alongside the image so `gh attestation verify` / `cosign verify-attestation`
  # work against the registry copy.
  publish:
    needs: [hadolint, build, scan, sca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom.cdx.json

      - name: Push to GHCR
        id: push
        env:
          # GITHUB_TOKEN's packages:write scope is enough here - no PAT, no long-lived
          # registry credential stored in the repo.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA:0:7}"
          # Written to the Docker config path, not skopeo's default
          # $XDG_RUNTIME_DIR/containers/auth.json: the attest steps below push the
          # attestation to the registry themselves and read Docker-format credentials.
          # (The two formats are the same JSON - only the default location differs.)
          mkdir -p "$HOME/.docker"
          skopeo login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin \
            --authfile "$HOME/.docker/config.json" <<<"$REGISTRY_TOKEN"
          skopeo copy --digestfile digest.txt \
            --authfile "$HOME/.docker/config.json" \
            "oci-archive:image.tar" "docker://${image}:${tag}"
          skopeo copy \
            --authfile "$HOME/.docker/config.json" \
            "docker://${image}:${tag}" "docker://${image}:latest"
          {
            echo "image=${image}"
            echo "digest=$(cat digest.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Drop registry credentials
        if: always()
        run: rm -f "$HOME/.docker/config.json"
