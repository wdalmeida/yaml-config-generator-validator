suite: service account
release:
  name: release
tests:
  - it: creates one by default, with no token mounted
    templates:
      - serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: release-yaml-config-generator-validator
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: creates nothing when create is false
    templates:
      - serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  # The Deployment must fall back to "default" rather than naming an account nobody created -
  # a pod referencing a missing ServiceAccount never schedules.
  - it: falls back to the default account when creating none
    templates:
      - deployment.yaml
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: uses a named existing account when given one
    templates:
      - deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: platform-readonly
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: platform-readonly

  - it: names the created account when both create and name are set
    templates:
      - serviceaccount.yaml
      - deployment.yaml
    set:
      serviceAccount.name: ycgv-sa
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/none
    asserts:
      - template: serviceaccount.yaml
        equal:
          path: metadata.name
          value: ycgv-sa
      - template: serviceaccount.yaml
        equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::000000000000:role/none
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: ycgv-sa
